name: NLP model reference and word counter regression evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nlp-reference-and-words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - run: npm install --global npm@12.2.1
      - name: Bind every canonical source input
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          evidence=Path(os.environ['RUNNER_TEMP'])/'nlp-reference-and-words'
          evidence.mkdir()
          source={}
          for row in subprocess.check_output(['git','ls-tree','-r','-z','HEAD']).split(b'\0'):
              if not row:continue
              meta,name=row.split(b'\t',1);mode,kind,blob=meta.decode().split();name=name.decode()
              assert kind=='blob' and mode in {'100644','100755'}
              data=Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob,name
              source[name]={'blob':blob,'sha256':hashlib.sha256(data).hexdigest()}
          (evidence/'source-before.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip(),'payloads':source},indent=2)+'\n')
          PY
      - run: npm ci --ignore-scripts --no-audit
      - name: Demonstrate the regression and verify the production fix with identical new cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          evidence=Path(os.environ['RUNNER_TEMP'])/'nlp-reference-and-words'
          production=Path('src/services/nlpService.js')
          current=production.read_bytes()
          baseline_head='7a2c93294e25ae19d6645f655d5b123ffe5a1fb5'
          baseline=subprocess.check_output(['git','show',baseline_head+':'+production.as_posix()])
          assert baseline!=current
          commands=[]
          try:
              for stage,payload,passed,failed in [('baseline',baseline,4,19),('fixed',current,23,0)]:
                  production.write_bytes(payload)
                  command=['npm','test','--','--runInBand','tests/nlpModelReferenceAndWords.test.js','--json','--outputFile='+str(evidence/(stage+'.json'))]
                  result=subprocess.run(command,check=False)
                  commands.append({'stage':stage,'command':command,'production_sha256':hashlib.sha256(payload).hexdigest(),'exit':result.returncode})
                  cases=json.loads((evidence/(stage+'.json')).read_text())
                  assert cases['numTotalTests']==23 and cases['numPassedTests']==passed and cases['numFailedTests']==failed
                  assert cases['numPendingTests']==cases['numTodoTests']==0
                  assert result.returncode==(1 if stage=='baseline' else 0)
          finally:
              production.write_bytes(current)
              (evidence/'commands.json').write_text(json.dumps({'baseline_head':baseline_head,'executions':commands,'original_cases_or_selectors_changed':False},indent=2)+'\n')
          PY
      - name: Verify all source inputs remain unchanged
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          evidence=Path(os.environ['RUNNER_TEMP'])/'nlp-reference-and-words'
          source=json.loads((evidence/'source-before.json').read_text())
          for name,row in source['payloads'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==row['sha256'],name
          (evidence/'source-after.json').write_text(json.dumps(source,indent=2)+'\n')
          PY
      - name: Retain original failure, fixed results and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nlp-model-reference-and-words-evidence
          path: ${{ runner.temp }}/nlp-reference-and-words/
          if-no-files-found: error
          retention-days: 7
