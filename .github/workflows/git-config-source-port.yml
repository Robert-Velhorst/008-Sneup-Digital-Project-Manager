name: Original configuration parser source and current stable dependencies

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  original-parser:
    name: Original configuration parser cases (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [upstream, private-port]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
      - run: npm install --global npm@12.2.1
      - name: Verify complete original input and select all current stable declarations
        id: declarations
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Keep checkout bytes stable and establish the real global Git config
          # expected by the original configuration-location case.
          git config --global core.autocrlf false
          mkdir -p "$RUNNER_TEMP/gitconfig-${VARIANT}-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/gitconfig-${VARIANT}-evidence/tested-head.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/gitconfig-${VARIANT}-evidence/tracked-source-sha256.txt"
          node --version > "$RUNNER_TEMP/gitconfig-${VARIANT}-evidence/node-version.txt"
          npm --version > "$RUNNER_TEMP/gitconfig-${VARIANT}-evidence/npm-version.txt"
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, urllib.parse, urllib.request
          from pathlib import Path
          variant = os.environ['VARIANT']
          assert variant in {'upstream', 'private-port'}
          evidence = Path(os.environ['RUNNER_TEMP']) / ('gitconfig-' + variant + '-evidence')
          target = Path(os.environ['RUNNER_TEMP']) / ('parse-git-config-' + variant)
          provenance = json.loads(Path('third_party/parse-git-config-port-provenance.json').read_text())
          assert provenance['repository'] == 'jonschlinkert/parse-git-config'
          assert provenance['upstream_commit'] == '60d1e75fe796ba4149bfceeb63b983503b21003c'
          subprocess.run(['git', 'clone', '--no-checkout', 'https://github.com/jonschlinkert/parse-git-config.git', str(target)], check=True)
          subprocess.run(['git', '-C', str(target), 'checkout', '--detach', provenance['upstream_commit']], check=True)
          commit = subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'HEAD']).decode().strip()
          assert commit == provenance['upstream_commit']
          (evidence / 'upstream-commit.txt').write_text(commit + '\n')
          original = provenance['complete_upstream_source_hashes']
          assert len(original) == 17
          tracked = subprocess.check_output(['git', '-C', str(target), 'ls-files', '-z']).decode().split('\0')
          assert set(tracked) - {''} == set(original)
          assert all(hashlib.sha256((target / p).read_bytes()).hexdigest() == h for p, h in original.items())
          (evidence / 'original-source-sha256.json').write_text(json.dumps(original, indent=2) + '\n')
          if variant == 'private-port':
              source = Path('third_party/parse-git-config-port')
              for path in original:
                  (target / path).write_bytes((source / path).read_bytes())
              assert all(hashlib.sha256((target / p).read_bytes()).hexdigest() == h for p, h in original.items() if p not in {'index.js', 'package.json'})
              before = json.loads((target / 'package.json').read_text())
          else:
              before = provenance['published_manifest']
          assert before['name'] == 'parse-git-config' and before['version'] == '3.0.0'
          assert before['scripts'] == {'test': 'mocha'}
          input_hashes = {p: hashlib.sha256((target / p).read_bytes()).hexdigest() for p in original if p != 'package.json'}
          (evidence / 'candidate-input-source-sha256.json').write_text(json.dumps(input_hashes, indent=2) + '\n')
          (evidence / 'package-before.json').write_text(json.dumps(before, indent=2) + '\n')
          catalog = {}
          for section in ['dependencies', 'devDependencies', 'optionalDependencies']:
              for name in before.get(section, {}):
                  url = 'https://registry.npmjs.org/' + urllib.parse.quote(name, safe='')
                  request = urllib.request.Request(url, headers={'Accept': 'application/vnd.npm.install-v1+json'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      metadata = json.load(response)
                  assert metadata['name'] == name
                  versions = [v for v in metadata['versions'] if re.fullmatch(r'\d+\.\d+\.\d+', v)]
                  highest = max(versions, key=lambda v: tuple(map(int, v.split('.'))))
                  catalog[name] = {'target': highest, 'public_stable_versions': versions, 'official_registry_url': url, 'target_metadata': metadata['versions'][highest]}
          target_package = json.loads(json.dumps(before))
          for section in ['dependencies', 'devDependencies', 'optionalDependencies']:
              for name in target_package.get(section, {}):
                  target_package[section][name] = catalog[name]['target']
          (target / 'package.json').write_text(json.dumps(target_package, indent=2) + '\n')
          (evidence / 'target-package.json').write_bytes((target / 'package.json').read_bytes())
          (evidence / 'stable-declaration-catalog.json').write_text(json.dumps(catalog, indent=2) + '\n')
          (evidence / 'variant.txt').write_text(variant + '\n')
          PY
      - name: Resolve normally and retain a full lock without lifecycle scripts
        id: install
        working-directory: ${{ runner.temp }}/parse-git-config-${{ matrix.variant }}
        run: |
          set -euo pipefail
          npm install --package-lock=true --package-lock-only --ignore-scripts --no-audit 2>&1 | tee "$RUNNER_TEMP/gitconfig-${{ matrix.variant }}-evidence/resolution.log"
          cp package-lock.json "$RUNNER_TEMP/gitconfig-${{ matrix.variant }}-evidence/package-lock.json"
          npm ci --package-lock=true --ignore-scripts --no-audit 2>&1 | tee "$RUNNER_TEMP/gitconfig-${{ matrix.variant }}-evidence/installation.log"
      - name: Run every original case with the unchanged upstream command
        id: original
        if: always() && steps.install.outcome == 'success'
        working-directory: ${{ runner.temp }}/parse-git-config-${{ matrix.variant }}
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/gitconfig-${{ matrix.variant }}-evidence/original-npm-test.log"
      - name: Retain the public upstream advisory independently of root-package audit coverage
        id: advisory_metadata
        if: always() && steps.declarations.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api advisories/GHSA-8g77-54rh-46hx > "$RUNNER_TEMP/gitconfig-${{ matrix.variant }}-evidence/upstream-advisory.json"
      - name: Retain every dependency advisory severity
        id: audit
        if: always() && steps.install.outcome == 'success'
        working-directory: ${{ runner.temp }}/parse-git-config-${{ matrix.variant }}
        run: npm audit --audit-level=low --json > "$RUNNER_TEMP/gitconfig-${{ matrix.variant }}-evidence/all-audit.json"
      - name: Require every lock resolution to be its highest public stable version
        id: graph
        if: always() && steps.install.outcome == 'success'
        working-directory: ${{ runner.temp }}/parse-git-config-${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'gitconfig-${{ matrix.variant }}-evidence'
          lock = json.loads(Path('package-lock.json').read_text())
          entries = [(path, item) for path, item in lock['packages'].items() if path]
          names = sorted({item.get('name') or path.rsplit('node_modules/', 1)[1] for path, item in entries})
          def query(name):
              url = 'https://registry.npmjs.org/' + urllib.parse.quote(name, safe='')
              try:
                  request = urllib.request.Request(url, headers={'Accept': 'application/vnd.npm.install-v1+json'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      metadata = json.load(response)
                  assert metadata['name'] == name
                  versions = [v for v in metadata['versions'] if re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', v)]
                  return name, {'highest_public_stable': max(versions, key=lambda v: tuple(map(int, v.split('.')))), 'official_registry_url': url}
              except Exception as error:
                  return name, {'unknown': str(error), 'official_registry_url': url}
          with ThreadPoolExecutor(max_workers=8) as pool:
              catalog = dict(pool.map(query, names))
          rows = []
          for path, item in entries:
              name = item.get('name') or path.rsplit('node_modules/', 1)[1]
              current = item.get('version')
              target = catalog[name].get('highest_public_stable')
              rows.append({'path': path, 'name': name, 'resolved': current, 'target': target,
                  'highest_stable': current == target if target else False, 'registry': catalog[name]})
          result = {'entries': rows, 'noncurrent_or_unknown': [r for r in rows if not r['highest_stable']]}
          (evidence / 'complete-stable-graph.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps({'lock_entries': len(rows), 'noncurrent_or_unknown': len(result['noncurrent_or_unknown'])}))
          assert not result['noncurrent_or_unknown'], 'The complete graph remains unqualified; no older-version fallback or override is accepted'
          PY
      - name: Preserve every original case and require all candidate gates
        if: always() && steps.declarations.outcome == 'success'
        env:
          VARIANT: ${{ matrix.variant }}
          INSTALL: ${{ steps.install.outcome }}
          ORIGINAL: ${{ steps.original.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          UPSTREAM_ADVISORY: ${{ steps.advisory_metadata.outcome }}
          GRAPH: ${{ steps.graph.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          variant = os.environ['VARIANT']
          evidence = Path(os.environ['RUNNER_TEMP']) / ('gitconfig-' + variant + '-evidence')
          source = Path(os.environ['RUNNER_TEMP']) / ('parse-git-config-' + variant)
          original = json.loads((evidence / 'original-source-sha256.json').read_text())
          inputs = json.loads((evidence / 'candidate-input-source-sha256.json').read_text())
          assert len(original) == 17 and len(inputs) == 16
          assert all(hashlib.sha256((source / p).read_bytes()).hexdigest() == h for p, h in inputs.items())
          assert all(inputs[p] == h for p, h in original.items() if p not in {'index.js', 'package.json'})
          before = json.loads((evidence / 'package-before.json').read_text())
          current = json.loads((source / 'package.json').read_text())
          sections = {'dependencies', 'devDependencies', 'optionalDependencies'}
          assert all(before.get(k) == current.get(k) for k in set(before) | set(current) if k not in sections)
          assert current['scripts'] == {'test': 'mocha'}
          with zipfile.ZipFile(evidence / 'candidate-source.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in original:
                  archive.write(source / path, path)
          (evidence / 'original-case-script-fixture-preservation-confirmed.txt').write_text('All original cases/helpers/fixtures and scripts unchanged.\n')
          advisory = json.loads((evidence / 'upstream-advisory.json').read_text())
          assert advisory['ghsa_id'] == 'GHSA-8g77-54rh-46hx'
          (evidence / 'advisory-clearance-not-claimed.txt').write_text('Upstream version identity/advisory retained; a private implementation patch is not official advisory clearance.\n')
          outcomes = {key: os.environ[key] for key in ['INSTALL', 'ORIGINAL', 'AUDIT', 'GRAPH', 'UPSTREAM_ADVISORY']}
          (evidence / 'original-gate-outcomes.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          assert all(value == 'success' for value in outcomes.values()), 'Candidate remains unqualified; no advisory suppression or application integration'
          PY
      - name: Retain every original source file and all failed outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitconfig-source-${{ matrix.variant }}
          path: ${{ runner.temp }}/gitconfig-${{ matrix.variant }}-evidence/
          if-no-files-found: error
