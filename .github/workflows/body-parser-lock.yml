name: Prepare ordinary body-parser lock refresh
on:
  push:
    branches: [audit/sneup-body-parser-lock-20261025]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
      - name: Record original source and resolve through the existing dependency range
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p "$RUNNER_TEMP/lock-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/lock-evidence/tested-head.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/lock-evidence/source-sha256.txt"
          cp package.json "$RUNNER_TEMP/lock-evidence/package-before.json"
          cp package-lock.json "$RUNNER_TEMP/lock-evidence/lock-before.json"
          node --version > "$RUNNER_TEMP/lock-evidence/node-version.txt"
          npm --version > "$RUNNER_TEMP/lock-evidence/npm-version.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          original = json.loads(path.read_text())
          assert original['overrides'].pop('qs') == '6.16.0'
          path.write_text(json.dumps(original, indent=2) + '\n')
          PY
          npm update body-parser qs --package-lock-only --ignore-scripts --no-audit
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          original = json.loads((Path(os.environ['RUNNER_TEMP']) / 'lock-evidence/package-before.json').read_text())
          del original['overrides']['qs']
          assert json.loads(Path('package.json').read_text()) == original
          PY
          cp package.json package-lock.json "$RUNNER_TEMP/lock-evidence/"
          git diff --name-only > "$RUNNER_TEMP/lock-evidence/changed-paths.txt"
          printf 'package-lock.json\npackage.json\n' > "$RUNNER_TEMP/expected-paths.txt"
          cmp "$RUNNER_TEMP/lock-evidence/changed-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          npm audit --json > "$RUNNER_TEMP/lock-evidence/audit.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ordinary-body-parser-lock
          path: ${{ runner.temp }}/lock-evidence/
          if-no-files-found: error
