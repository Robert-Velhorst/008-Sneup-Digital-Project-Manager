name: MongoDB image tool identity
on:
  push:
    branches: [qualify/mongo-tool-identity-20261029]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extract without starting image or connecting to a database
        shell: bash
        run: |
          set -euo pipefail
          image='mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058'
          docker pull "$image"
          container_id=$(docker create "$image")
          trap 'docker rm "$container_id" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/mongo-tool-identity"
          docker cp "$container_id:/usr/bin/mongodump" "$RUNNER_TEMP/mongo-tool-identity/mongodump"
          docker cp "$container_id:/usr/bin/mongorestore" "$RUNNER_TEMP/mongo-tool-identity/mongorestore"
          sha256sum "$RUNNER_TEMP/mongo-tool-identity/mongodump" "$RUNNER_TEMP/mongo-tool-identity/mongorestore" > "$RUNNER_TEMP/mongo-tool-identity/tool-sha256.txt"
          docker image inspect "$image" --format '{{.Id}} {{.Os}} {{.Architecture}}' > "$RUNNER_TEMP/mongo-tool-identity/image-identity.txt"
          rm "$RUNNER_TEMP/mongo-tool-identity/mongodump" "$RUNNER_TEMP/mongo-tool-identity/mongorestore"
      - name: Retain hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mongo-tool-identity
          path: ${{ runner.temp }}/mongo-tool-identity/
          if-no-files-found: warn
          retention-days: 7
