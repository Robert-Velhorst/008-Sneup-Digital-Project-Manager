name: Qualify current stable Electron lock
on:
  push:
    branches: [qualify/sneup-electron-451-20261028]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm install --global npm@12.2.1
      - run: python .github/scripts/qualify-electron-current.py prepare
      - run: python .github/scripts/qualify-electron-current.py resolve
      - name: Preserve original source and exact generated manifest and lock
        if: always()
        run: python .github/scripts/qualify-electron-current.py collect
      - name: Require the unfiltered all-severity dependency audit
        run: npm audit --audit-level=low --json > artifacts/electron-current-lock/audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sneup-electron-current-lock
          path: artifacts/electron-current-lock
          if-no-files-found: error
          retention-days: 14
